<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#15101f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Arcade">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Pocket Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@400;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* Layout idea: a shelf of numbered cartridges, colour-coded by genre; one game fills the screen at a time. Single dark theme by choice. */
:root{
  --bg:#15101f; --panel:#211a33; --panel2:#2b2242; --line:#3a2f5a; --ink:#f4eeff; --mut:#a297c0;
  --arc:#ff5d5d; --puz:#ffc93c; --brd:#2fd6b5; --wrd:#5aa9ff; --crd:#ff7ac6;
  --display:'Bungee',Impact,'Arial Black',sans-serif; --body:'Chakra Petch',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--body);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
[hidden]{display:none!important}

/* ---------- home ---------- */
#home{max-width:1040px;margin:0 auto;padding:calc(22px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(48px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:18px}
.mast{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 20px}
.mast h1{font:400 clamp(30px,9vw,58px)/.95 var(--display);margin:0;letter-spacing:.01em;text-wrap:balance}
.mast h1 span{color:var(--puz)}
.mast p{margin:0;color:var(--mut);max-width:34ch}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
#q{flex:1 1 180px;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
#q::placeholder{color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:600;font-size:14px;color:var(--mut)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.cart{--k:var(--arc);position:relative;text-align:left;background:var(--panel);border:1px solid var(--line);border-top:5px solid var(--k);border-radius:6px 6px 12px 12px;padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;min-height:112px;transition:transform .12s,background .12s}
.cart:hover{background:var(--panel2);transform:translateY(-3px)}
.cart:active{transform:translateY(1px)}
.cart .no{font:400 30px/1 var(--display);color:var(--k)}
.cart .nm{font-weight:700;font-size:17px;line-height:1.2;margin-top:4px}
.cart .ct{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
.cart .bs{position:absolute;top:10px;right:10px;font-size:12px;font-weight:600;color:var(--mut);font-variant-numeric:tabular-nums}
.none{color:var(--mut);padding:20px 0}
@media (prefers-reduced-motion:reduce){.cart{transition:none}}

/* ---------- game ---------- */
#game{height:100%;display:flex;flex-direction:column}
#bar{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 8px max(12px,env(safe-area-inset-left));border-bottom:1px solid var(--line);background:var(--panel)}
#mute{background:transparent;border:1px solid var(--line);border-radius:8px;width:38px;height:34px;padding:0;font-size:16px;line-height:1}
#back{background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-weight:700;white-space:nowrap}
#gname{font:400 clamp(15px,4.6vw,20px)/1.1 var(--display);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat{text-align:right;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;line-height:1.15}
.stat b{display:block;font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:0}
#wrap{flex:1;min-height:0;overflow:auto;position:relative}
#help{margin:0;padding:8px 16px 0;color:var(--mut);font-size:14px;text-align:center}
#status{display:flex;justify-content:center;gap:16px;padding:4px 16px 0;min-height:26px;font-weight:600;font-variant-numeric:tabular-nums;text-align:center}
#clock{color:var(--puz)}
#stage{padding:8px 16px 28px;display:flex;flex-direction:column;align-items:center;gap:12px}
canvas.cv{display:block;background:#0e0a17;border:1px solid var(--line);border-radius:10px;touch-action:none;user-select:none;-webkit-user-select:none}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 16px;font-weight:700;min-height:44px}
.btn:hover{border-color:var(--mut)}
.btn:disabled{opacity:.4;cursor:default}
.btn.pri{background:var(--puz);border-color:var(--puz);color:#1b1400}
.btn.on{background:var(--ink);color:var(--bg)}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;width:100%}
.pad{display:flex;gap:8px;justify-content:center;width:100%;max-width:420px}
.pad .btn{flex:1;font-size:22px;min-height:58px;padding:6px;touch-action:none;user-select:none;-webkit-user-select:none}
.g{display:grid;gap:6px;width:100%;user-select:none;-webkit-user-select:none}
.c{aspect-ratio:1;min-width:0;padding:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:clamp(13px,4.4vw,22px);line-height:1;overflow:hidden}
.c.flat{cursor:default}
.c.sel{outline:3px solid var(--puz);outline-offset:-3px}
.c.dim{background:#120d1d;border-color:#241c39}
.c.bad{color:var(--arc)}
.c.fix{color:var(--mut)}
.big{font:400 clamp(26px,9vw,44px)/1.1 var(--display);text-align:center;margin:0;text-wrap:balance}
.note{color:var(--mut);text-align:center;margin:0;max-width:40ch}
.dot{display:block;width:72%;height:72%;border-radius:50%}
.card{position:relative;flex:none;width:62px;height:88px;border-radius:9px;background:linear-gradient(#ffffff,#efe9f8);color:#1a1326;display:grid;place-items:center;font-weight:700;border:1px solid #cfc4e6;box-shadow:0 3px 6px rgba(0,0,0,.35)}
.card .ck{position:absolute;top:4px;left:6px;font-size:14px;line-height:1.05;text-align:center}
.card .ck2{position:absolute;bottom:4px;right:6px;font-size:14px;line-height:1.05;text-align:center;transform:rotate(180deg)}
.card .cs{font-size:30px;line-height:1}
.felt{background:radial-gradient(ellipse at 50% 25%,#23885a,#0f4a30 75%);border-radius:20px;padding:14px 10px;width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:inset 0 0 0 6px #6b4423,inset 0 0 0 8px #4a2e17,0 6px 18px rgba(0,0,0,.4)}
.felt .note{color:#cfe9d8}
.card.red{color:#d42a4c}
.card.back{background:repeating-linear-gradient(45deg,#b8344c 0 6px,#962a3e 6px 12px);border:3px solid #fff}
.hand{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;min-height:82px}
.kb{display:flex;flex-direction:column;gap:6px;width:100%;max-width:460px}
.kb div{display:flex;gap:4px;justify-content:center}
.kb button{flex:1;min-width:0;max-width:44px;height:46px;padding:0;border-radius:6px;border:1px solid var(--line);background:var(--panel2);font-weight:700;text-transform:uppercase}
.kb button.wide{max-width:64px;flex:1.5}
.txt{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:20px;width:100%;max-width:340px;text-align:center}

.pop{animation:pop .2s ease-out}
@keyframes pop{0%{transform:scale(.55)}65%{transform:scale(1.12)}100%{transform:scale(1)}}
.shake{animation:shake .32s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.flipx{animation:flipx .26s ease-out}
@keyframes flipx{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
.flipy{animation:flipy .3s ease-out both}
@keyframes flipy{0%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
.dropin{animation:dropin .32s cubic-bezier(.5,0,.75,0) both}
@keyframes dropin{0%{transform:translateY(var(--d,-300px))}100%{transform:translateY(0)}}
.lift{transform:translateY(-14px)}
@media (prefers-reduced-motion:reduce){.pop,.shake,.flipx,.flipy,.dropin{animation:none}}
#over{position:absolute;inset:0;background:rgba(14,10,23,.86);display:grid;place-items:center;padding:16px;z-index:5}
#over .box{background:var(--panel);border:1px solid var(--line);border-top:5px solid var(--puz);border-radius:6px 6px 14px 14px;padding:22px 20px;text-align:center;display:flex;flex-direction:column;gap:12px;width:min(340px,100%)}
#omsg{font:400 28px/1.1 var(--display);margin:0;text-wrap:balance}
#oscore{margin:0;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
#onew{margin:0;color:var(--puz);font-weight:700}
</style>
</head>
<body>
<main id="home">
  <header class="mast">
    <h1>Pocket <span>Arcade</span></h1>
    <p id="tag"></p>
  </header>
  <div class="tools">
    <input id="q" type="search" placeholder="Find a game" autocomplete="off" aria-label="Find a game">
    <button class="btn pri" id="rand" type="button">Random game</button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="shelf" id="shelf"></div>
</main>
<section id="game" hidden>
  <div id="bar">
    <button id="back" type="button">&larr; Games</button>
    <div id="gname"></div>
    <button id="mute" type="button" aria-label="Sound on">&#128266;</button>
    <div class="stat" id="sbox"><span id="slab">Score</span><b id="score">0</b></div>
    <div class="stat" id="bbox">Best<b id="best">-</b></div>
  </div>
  <div id="wrap">
    <p id="help"></p>
    <div id="status"><span id="info"></span><span id="clock"></span></div>
    <div id="stage"></div>
    <div id="over" hidden>
      <div class="box">
        <p id="omsg"></p>
        <p id="oscore"></p>
        <p id="onew">New best</p>
        <button class="btn pri" id="again" type="button">Play again</button>
        <button class="btn" id="quit" type="button">All games</button>
      </div>
    </div>
  </div>
</section>
<script>
'use strict';
const $=(t,c,p,txt)=>{const e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;if(p)p.appendChild(e);if(t==='button')e.type='button';return e};
const R=n=>Math.floor(Math.random()*n);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=R(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const store={get(k){try{return JSON.parse(localStorage.getItem('pa_'+k))}catch(e){return null}},set(k,v){try{localStorage.setItem('pa_'+k,JSON.stringify(v))}catch(e){}}};
const C={bg:'#0e0a17',ink:'#f4eeff',mut:'#a297c0',red:'#ff5d5d',yel:'#ffc93c',teal:'#2fd6b5',blue:'#5aa9ff',pink:'#ff7ac6',line:'#3a2f5a',vio:'#9b7bff',org:'#ff9f43',panel:'#211a33'};
const PAL=[C.red,C.yel,C.teal,C.blue,C.pink,C.vio,C.org];
const FONT=(s,w=600)=>`${w} ${s}px "Chakra Petch",system-ui,sans-serif`;
const CATS=['Arcade','Puzzle','Board','Words & Math','Cards & Reflex'];
const CATVAR={'Arcade':'--arc','Puzzle':'--puz','Board':'--brd','Words & Math':'--wrd','Cards & Reflex':'--crd'};
const GAMES=[];
const reg=(id,name,cat,help,fn,opt)=>GAMES.push(Object.assign({id,name,cat,help,fn},opt||{}));
const el={};['home','game','bar','gname','score','best','slab','sbox','bbox','help','info','clock','stage','over','omsg','oscore','onew','again','quit','back','mute','shelf','chips','q','rand','tag','wrap'].forEach(i=>el[i]=document.getElementById(i));
const KEYMAP={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',' ':'space',Enter:'enter',Backspace:'back'};
let cur=null;
const noise=(dur=.15,vol=.08,when=0,hp=800)=>{if(MUTED||!AC||AC.state!=='running')return;try{const n=Math.floor(AC.sampleRate*dur),buf=AC.createBuffer(1,n,AC.sampleRate),d=buf.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource(),f=AC.createBiquadFilter(),gn=AC.createGain(),t=AC.currentTime+when;s.buffer=buf;f.type='bandpass';f.frequency.value=hp;gn.gain.value=vol;s.connect(f);f.connect(gn);gn.connect(AC.destination);s.start(t)}catch(e){}};
const SFX={tap:()=>beep(620,.04,'square',.03),tick:()=>beep(900,.025,'square',.025),ok:()=>{beep(660,.06,'square',.045);beep(990,.09,'square',.045,.06)},bad:()=>beep(150,.18,'sawtooth',.05,0,90),
  pop:(n=0)=>beep(400+n*60,.06,'square',.045,0,800+n*80),flip:()=>noise(.05,.12,0,2500),card:()=>noise(.07,.14,0,3200),thud:()=>beep(120,.09,'triangle',.12,0,60),
  win:()=>[523,659,784,1047,1319].forEach((f,i)=>beep(f,.12,'square',.05,i*.09)),lose:()=>{beep(330,.18,'square',.05);beep(247,.18,'square',.05,.18);beep(165,.4,'sawtooth',.05,.36,90)},
  end:()=>{beep(523,.1,'square',.05);beep(392,.18,'square',.05,.1)},boom:()=>{noise(.5,.25,0,300);beep(90,.45,'sawtooth',.06,0,30)}};
function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const cv=document.createElement('canvas');cv.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50';document.body.appendChild(cv);
  const w=cv.width=innerWidth,h=cv.height=innerHeight,g=cv.getContext('2d'),ps=Array.from({length:110},()=>({x:w/2+(Math.random()-.5)*w*.4,y:h*.35,vx:(Math.random()-.5)*9,vy:-Math.random()*11-3,r:Math.random()*6,c:PAL[R(PAL.length)],s:4+Math.random()*5}));let t0=performance.now();
  const f=t=>{const k=(t-t0)/1000;g.clearRect(0,0,w,h);ps.forEach(p=>{p.vy+=.32;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=.15;g.save();g.translate(p.x,p.y);g.rotate(p.r);g.fillStyle=p.c;g.globalAlpha=Math.max(0,1-k/2.4);g.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);g.restore()});if(k<2.4)requestAnimationFrame(f);else cv.remove()};requestAnimationFrame(f)}
const anim=(e,c)=>{if(!e)return;e.classList.remove(c);void e.offsetWidth;e.classList.add(c)};
/* sound: tiny synth beeps. Browsers only allow audio after a tap or key press, so unlock on the first one. */
let AC=null;
const unlockAudio=()=>{try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}};
['pointerdown','touchend','click','keydown'].forEach(ev=>window.addEventListener(ev,unlockAudio,true));
let MUTED=!!store.get('mute');
const beep=(f,dur=.08,type='square',vol=.06,when=0,f2)=>{if(MUTED||!AC||AC.state!=='running')return;try{const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+when;o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}};

function makeCtx(game){
  const stage=el.stage,cleanups=[];
  const ctx={stage,paused:false,done:false,dead:false,held:{},_s:0,_key:null,
    on(t,ev,fn,opt){t.addEventListener(ev,fn,opt);cleanups.push(()=>t.removeEventListener(ev,fn,opt))},
    score(n){ctx._s=n;el.score.textContent=n},
    info(t){el.info.textContent=t},
    loop(fn){let last=performance.now(),id;const f=t=>{if(ctx.dead)return;id=requestAnimationFrame(f);const dt=Math.min(.05,Math.max(0,(t-last)/1000));last=t;if(!ctx.paused)fn(dt)};id=requestAnimationFrame(f);cleanups.push(()=>cancelAnimationFrame(id))},
    every(ms,fn){const id=setInterval(()=>{if(!ctx.dead&&!ctx.paused)fn()},ms);cleanups.push(()=>clearInterval(id))},
    after(ms,fn){const id=setTimeout(()=>{if(!ctx.dead)fn()},ms);cleanups.push(()=>clearTimeout(id))},
    clock(sec,end){const o={t:sec};const show=()=>el.clock.textContent='Time '+Math.ceil(o.t);show();ctx.every(100,()=>{o.t-=.1;if(o.t<=0){o.t=0;show();end()}else show()});return o},
    canvas(w,h,reserve){const cv=$('canvas','cv',stage);const dpr=Math.min(2,window.devicePixelRatio||1);cv.width=w*dpr;cv.height=h*dpr;const g=cv.getContext('2d');g.scale(dpr,dpr);
      const fit=()=>{const aw=Math.max(140,stage.clientWidth-32),ah=Math.max(160,window.innerHeight-el.bar.offsetHeight-(reserve||0)-96);const s=Math.min(aw/w,ah/h,1.9);cv.style.width=Math.round(w*s)+'px';cv.style.height=Math.round(h*s)+'px'};
      fit();ctx.on(window,'resize',fit);
      cv.pos=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*w/r.width,y:(e.clientY-r.top)*h/r.height}};
      return{cv,g}},
    follow(cv,x0){const p={x:x0,y:0,down:false,tap:null};const mv=e=>{const q=cv.pos(e);p.x=q.x;p.y=q.y;return q};
      ctx.on(cv,'pointerdown',e=>{e.preventDefault();p.down=true;const q=mv(e);if(p.tap&&!ctx.paused)p.tap(q)});ctx.on(cv,'pointermove',mv);ctx.on(window,'pointerup',()=>p.down=false);return p},
    keys(fn){ctx._key=fn},
    pad(list){const r=$('div','pad',stage);list.forEach(([lab,k,aria])=>{const b=$('button','btn',r,lab);b.setAttribute('aria-label',aria||k);
      ctx.on(b,'pointerdown',e=>{e.preventDefault();ctx.held[k]=true;if(!ctx.paused&&ctx._key)ctx._key(k)});const up=()=>{ctx.held[k]=false};
      ctx.on(b,'pointerup',up);ctx.on(b,'pointerleave',up);ctx.on(b,'pointercancel',up)});return r},
    swipe(t,fn){let s=null,fired=false;const old=t.style.touchAction;t.style.touchAction='none';cleanups.push(()=>t.style.touchAction=old);
      ctx.on(t,'pointerdown',e=>{s={x:e.clientX,y:e.clientY};fired=false});
      ctx.on(t,'pointermove',e=>{if(!s||ctx.paused)return;const dx=e.clientX-s.x,dy=e.clientY-s.y;if(Math.hypot(dx,dy)>24){fired=true;s={x:e.clientX,y:e.clientY};fn(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'),e)}});
      ctx.on(window,'pointerup',e=>{if(s&&!fired&&!ctx.paused&&e.target&&t.contains(e.target))fn('tap',e);s=null})},
    row(){return $('div','row',stage)},
    btn(p,label,fn,cls){const b=$('button','btn'+(cls?' '+cls:''),p,label);ctx.on(b,'click',()=>{if(!ctx.paused)fn(b)});return b},
    grid(cols,n,max,gap){const g=$('div','g',stage);const rows=Math.ceil(n/cols);g.style.gridTemplateColumns=`repeat(${cols},1fr)`;if(gap!=null)g.style.gap=gap+'px';
      g.style.maxWidth=`min(${max||420}px, max(220px, calc((100dvh - 270px) * ${cols} / ${rows})))`;const cs=[];for(let i=0;i<n;i++)cs.push($('button','c',g));return cs},
    over(msg,score,kind){if(ctx.dead||ctx.done)return;ctx.done=ctx.paused=true;if(kind==='win'){SFX.win();confetti()}else if(kind==='lose')SFX.lose();else if(kind==='end')SFX.end();if(score===undefined)score=ctx._s;let nb=false;
      if(score!=null&&!game.ns){const b=store.get('b_'+game.id);if((b==null&&(game.low||score>0))||(b!=null&&(game.low?score<b:score>b))){store.set('b_'+game.id,score);nb=true;el.best.textContent=score}}
      ctx.after(450,()=>{el.omsg.textContent=msg;el.oscore.textContent=score!=null&&!game.ns?(game.sl||'Score')+' '+score:'';el.oscore.hidden=!el.oscore.textContent;el.onew.hidden=!nb;el.over.hidden=false})},
    destroy(){ctx.dead=true;cleanups.forEach(f=>{try{f()}catch(e){}})}

  for(let n=1;n<=10;n++){const b=$('button','btn',pad,n===10?'⌫':String(n));b.style.fontSize='20px';if(n===10)b.setAttribute('aria-label','Erase');pb.push(b);ctx.on(b,'click',()=>{if(!ctx.paused)put(n%10)})}
  ctx.keys(k=>{if(/^[1-9]$/.test(k))put(+k);else if(k==='back'||k==='0')put(0);else if(sel>=0&&['left','right','up','down'].includes(k)){const d={left:-1,right:1,up:-9,down:9}[k];sel=clamp(sel+d,0,80);draw()}});
  ctx.every(1000,()=>ctx.score(++t));draw();
},{low:true,sl:'Seconds'});

reg('lights','Lights Out','Puzzle','Tapping a light flips it and its four neighbours. Turn every light off in as few moves as you can.',ctx=>{

  const draw=()=>{cs.forEach((c,i)=>{c.style.borderRadius='50%';c.style.border='0';c.style.transition='background .15s,box-shadow .15s';
    c.style.background=b[i]?'radial-gradient(circle at 40% 35%,#fffbe0,#ffd84a 45%,#d4920f)':'radial-gradient(circle at 40% 35%,#3a3152,#1d1730 70%)';c.style.boxShadow=b[i]?'0 0 22px rgba(255,216,74,.65)':'inset 0 2px 4px rgba(0,0,0,.6)'});ctx.info('Lights on '+b.filter(Boolean).length)};

},{low:true,sl:'Moves'});

reg('slide','Slide 15','Puzzle','Tap a tile next to the gap to slide it. Put the numbers in order, 1 to 15, with the gap last.',ctx=>{
  const b=[...Array(15).keys()].map(i=>i+1).concat(0);let mv=0;const cs=ctx.grid(4,16,360,6);boardBox(cs,'#4a2e1a',10);
  const adj=i=>{const x=i%4,y=(i/4)|0,o=[];if(x>0)o.push(i-1);if(x<3)o.push(i+1);if(y>0)o.push(i-4);if(y<3)o.push(i+4);return o};
  let e=15,last=-1;for(let k=0;k<200;k++){const o=adj(e).filter(j=>j!==last);const j=o[R(o.length)];b[e]=b[j];b[j]=0;last=e;e=j}
  const draw=mvd=>cs.forEach((c,i)=>{c.textContent=b[i]||'';c.style.border='0';c.style.borderRadius='10px';c.style.fontSize='clamp(20px,7vw,32px)';
    if(!b[i]){c.style.background='rgba(0,0,0,.35)';c.style.boxShadow='inset 0 3px 8px rgba(0,0,0,.5)';return}
    const ok=b[i]===i+1;c.style.background=ok?'linear-gradient(#d8efc4,#9fcf84)':'linear-gradient(#f0cf9c,#c99558)';c.style.color='#3b2410';c.style.boxShadow='inset 0 2px 0 rgba(255,255,255,.4),0 3px 0 rgba(0,0,0,.35)';if(i===mvd)anim(c,'pop')});
  cs.forEach((c,i)=>ctx.on(c,'click',()=>{if(ctx.paused)return;const z=b.indexOf(0);if(!adj(i).includes(z)){if(b[i])anim(c,'shake');return}b[z]=b[i];b[i]=0;ctx.score(++mv);noise(.07,.12,0,700);beep(180,.05,'triangle',.06);draw(z);
    ctx.info('In place '+b.filter((v,k)=>v===k+1).length+' / 15');if(b.every((v,k)=>v===(k+1)%16))ctx.over('In order',undefined,'win')}));draw();ctx.info('In place '+b.filter((v,k)=>v===k+1).length+' / 15');
},{low:true,sl:'Moves'});

reg('flood','Flood','Puzzle','Start from the top-left corner. Pick a colour to flood into matching neighbours. Fill the whole board in 22 moves.',ctx=>{
  const N=12,S=25,MAX=22,{cv,g}=ctx.canvas(300,300,120);const b=Array.from({length:N*N},()=>R(6));let mv=0,mine=new Set([0]);
  const region=()=>{const c=b[0],seen=new Set([0]),st=[0];while(st.length){const i=st.pop(),x=i%N,y=(i/N)|0;[[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{const a=x+dx,d=y+dy,j=d*N+a;if(a>=0&&d>=0&&a<N&&d<N&&!seen.has(j)&&b[j]===c){seen.add(j);st.push(j)}})}return seen};
  const draw=()=>{g.fillStyle='#0e0a17';g.fillRect(0,0,300,300);mine=region();b.forEach((c,i)=>{const x=(i%N)*S,y=((i/N)|0)*S;g.fillStyle=PAL[c];rrect(g,x+1,y+1,S-2,S-2,mine.has(i)?3:6);g.fill();if(mine.has(i)){g.fillStyle='rgba(255,255,255,.18)';g.fillRect(x+1,y+1,S-2,3)}});
    ctx.info('Moves '+mv+' / '+MAX+'   Filled '+Math.round(mine.size/(N*N)*100)+'%')};
  const fill=c=>{const o=b[0];if(o===c||ctx.paused)return;mine.forEach(i=>b[i]=c);ctx.score(++mv);draw();const k=mine.size/(N*N);beep(240+k*700,.08,'square',.045,0,320+k*800);
    if(b.every(v=>v===c))ctx.over('Flooded',undefined,'win');else if(mv>=MAX)ctx.over('Out of moves',null,'lose')};
  const r=ctx.row();for(let c=0;c<6;c++){const k=ctx.btn(r,'',()=>fill(c));k.style.cssText+=`;background:${PAL[c]};border-color:${PAL[c]};width:46px;height:46px;border-radius:50%;box-shadow:inset 0 3px 0 rgba(255,255,255,.3)`;k.setAttribute('aria-label','Colour '+(c+1))}draw();
},{low:true,sl:'Moves'});

reg('hanoi','Tower Stack','Puzzle','Move all five rings to the right-hand peg. Tap a peg to lift its top ring, tap another to drop it. A bigger ring can never sit on a smaller one.',ctx=>{
  const N=5,pg=[[5,4,3,2,1],[],[]];let sel=-1,mv=0;const r=ctx.row();r.style.flexWrap='nowrap';r.style.maxWidth='460px';r.style.alignItems='stretch';r.style.gap='6px';

    pg[i].forEach((d,k)=>{const e=$('span','',b);const top=k===pg[i].length-1&&i===sel;e.style.cssText=`position:relative;display:block;height:22px;border-radius:11px;width:${22+d*15}%;background:linear-gradient(${RC[d-1]},${RC[d-1]}cc);box-shadow:inset 0 3px 0 rgba(255,255,255,.35),0 2px 0 rgba(0,0,0,.3);transition:transform .15s;${top?'transform:translateY(-26px)':''}`})});
    ctx.info('Moves '+mv+'   Fewest possible 31')};draw();
},{low:true,sl:'Moves'});

reg('maze','Maze Run','Puzzle','Swipe or use the arrow keys. You slide until the next junction. Reach the star before time runs out. Each maze adds time.',ctx=>{
  const {cv,g}=ctx.canvas(300,300);let N,m,x,y,vx,vy,sc=0,trail=[],t=0;const D={up:[0,-1,1,4],right:[1,0,2,8],down:[0,1,4,1],left:[-1,0,8,2]};
  const gen=()=>{N=Math.min(8+sc*2,16);m=Array(N*N).fill(0);const seen=Array(N*N).fill(false),st=[0];seen[0]=true;
    while(st.length){const i=st[st.length-1],cx=i%N,cy=(i/N)|0;const o=Object.values(D).filter(([dx,dy])=>{const a=cx+dx,b=cy+dy;return a>=0&&b>=0&&a<N&&b<N&&!seen[b*N+a]});
      if(!o.length){st.pop();continue}const [dx,dy,bit,opp]=o[R(o.length)],j=(cy+dy)*N+cx+dx;m[i]|=bit;m[j]|=opp;seen[j]=true;st.push(j)}x=y=vx=vy=0;trail=[[0,0]]};
  const pc=v=>(v&1)+((v>>1)&1)+((v>>2)&1)+((v>>3)&1);
  const ck=ctx.clock(60,()=>ctx.over('Time up',undefined,'end'));
  ctx.every(1000,()=>{if(ck.t<=10.5&&ck.t>0)beep(1000,.03,'square',.03)});
  const move=k=>{const d=D[k];if(!d)return;let n=0;while(m[y*N+x]&d[2]){x+=d[0];y+=d[1];n++;trail.push([x,y]);if((x===N-1&&y===N-1)||pc(m[y*N+x])!==2)break}
    if(!n){beep(140,.05,'triangle',.06);return}beep(420,.07,'triangle',.04,0,240+n*30);
    if(x===N-1&&y===N-1){ctx.score(++sc);ck.t+=20;SFX.ok();ctx.info('+20 seconds');ctx.after(60,()=>{gen()})}};
  ctx.keys(move);ctx.swipe(ctx.stage,move);gen();
  ctx.loop(dt=>{t+=dt;vx+=(x-vx)*Math.min(1,dt*18);vy+=(y-vy)*Math.min(1,dt*18);const S=300/N;g.fillStyle='#07061a';g.fillRect(0,0,300,300);
    g.strokeStyle='rgba(255,122,198,.35)';g.lineWidth=S*.28;g.lineCap='round';g.lineJoin='round';g.beginPath();trail.forEach(([a,b],i)=>{const px=a*S+S/2,py=b*S+S/2;i?g.lineTo(px,py):g.moveTo(px,py)});g.stroke();
    const gx=(N-1)*S+S/2,gy=(N-1)*S+S/2,pu=1+Math.sin(t*5)*.15;g.save();g.translate(gx,gy);g.rotate(t);g.scale(pu,pu);g.fillStyle='#ffd84a';g.shadowColor='#ffd84a';g.shadowBlur=14;g.beginPath();for(let k=0;k<10;k++){const r=k%2?S*.15:S*.34,a=k*Math.PI/5;g.lineTo(Math.cos(a)*r,Math.sin(a)*r)}g.fill();g.restore();
    g.shadowColor='#5aa9ff';g.shadowBlur=8;g.strokeStyle='#5aa9ff';g.lineWidth=2;g.lineCap='square';g.beginPath();
    m.forEach((v,i)=>{const a=(i%N)*S,b=((i/N)|0)*S;if(!(v&1)){g.moveTo(a,b);g.lineTo(a+S,b)}if(!(v&8)){g.moveTo(a,b);g.lineTo(a,b+S)}if(!(v&2)){g.moveTo(a+S,b);g.lineTo(a+S,b+S)}if(!(v&4)){g.moveTo(a,b+S);g.lineTo(a+S,b+S)}});g.stroke();g.shadowBlur=0;
    g.shadowColor='#ff7ac6';g.shadowBlur=12;g.fillStyle='#ff7ac6';g.beginPath();g.arc(vx*S+S/2,vy*S+S/2,S*.3,0,7);g.fill();g.shadowBlur=0;g.fillStyle='#fff';g.beginPath();g.arc(vx*S+S/2-S*.08,vy*S+S/2-S*.08,S*.08,0,7);g.fill()});
},{sl:'Mazes'});

reg('memory','Memory Match','Puzzle','Flip two cards at a time and find all eight pairs in as few turns as you can.',ctx=>{
  const SY=['★','◆','●','▲','■','♥','♣','☼'];const d=shuffle([...Array(16).keys()].map(i=>i>>1));
  const st=Array(16).fill(0);let a=-1,lock=false,mv=0,found=0,streak=0;const cs=ctx.grid(4,16,360,8);

    else{streak=0;lock=true;ctx.after(650,()=>{SFX.bad();anim(cs[b],'shake');anim(cs[i],'shake');ctx.after(250,()=>{st[b]=st[i]=0;lock=false;draw()})})}})});draw();

reg('code','Code Breaker','Puzzle','Crack the hidden four-colour code in ten guesses. Colours can repeat. Solid dots mean right colour, right place. Hollow dots mean right colour, wrong place.',ctx=>{
  const code=[0,1,2,3].map(()=>R(6));let cur=[],n=0;const log=$('div','',ctx.stage);log.style.cssText='display:flex;flex-direction:column;gap:6px;width:100%;max-width:340px';
  const peg=(p,c,sz=28)=>{const e=$('span','',p);e.style.cssText=`display:inline-block;width:${sz}px;height:${sz}px;border-radius:50%;background:${c==null?'rgba(255,255,255,.04)':`radial-gradient(circle at 35% 30%,#fff8,${PAL[c]} 45%)`};border:2px solid ${c==null?C.line:PAL[c]};box-shadow:${c==null?'inset 0 2px 4px #0008':'0 2px 0 #0006'}`;return e};
  const now=$('div','row',ctx.stage);now.style.padding='10px';now.style.background='#211a33';now.style.borderRadius='14px';now.style.maxWidth='340px';const draw=()=>{now.textContent='';for(let i=0;i<4;i++)peg(now,cur[i],34)};
  const r=ctx.row();for(let c=0;c<6;c++){const k=ctx.btn(r,'',()=>{if(cur.length<4){cur.push(c);beep(400+c*80,.05,'square',.04);draw();anim(now.children[cur.length-1],'pop')}});k.style.cssText+=`;background:radial-gradient(circle at 35% 30%,#fff8,${PAL[c]} 45%);border-color:${PAL[c]};width:44px;height:44px;border-radius:50%`;k.setAttribute('aria-label','Colour '+(c+1))}
  const r2=ctx.row();ctx.btn(r2,'Undo',()=>{cur.pop();SFX.tap();draw()});ctx.btn(r2,'Check',()=>{if(cur.length<4){anim(now,'shake');return SFX.bad()}let ex=0,cl=0;const a=[],b=[];cur.forEach((c,i)=>{if(c===code[i])ex++;else{a.push(c);b.push(code[i])}});a.forEach(c=>{const j=b.indexOf(c);if(j>=0){cl++;b.splice(j,1)}});
    const row=$('div','',log);row.style.cssText='display:flex;gap:10px;align-items:center;background:#1a1428;border-radius:10px;padding:6px 10px';$('span','',row,String(n+1)).style.cssText='width:18px;color:#a297c0;font-weight:700';
    const l=$('span','',row);l.style.cssText='display:flex;gap:6px;flex:1';cur.forEach(c=>peg(l,c,24));
    const fb=$('span','',row);fb.style.cssText='display:grid;grid-template-columns:repeat(2,10px);gap:3px';for(let i=0;i<4;i++){const d=$('span','',fb);d.style.cssText=`width:10px;height:10px;border-radius:50%;${i<ex?'background:#ffd84a':i<ex+cl?'border:2px solid #f4eeff':'background:#2b2242'}`}
    anim(row,'pop');for(let i=0;i<ex;i++)beep(800+i*120,.05,'square',.04,i*.07);if(!ex)beep(300,.08,'triangle',.06);
    ctx.score(++n);ctx.info('Guess '+n+' / 10');if(ex===4)return ctx.over('Code cracked',undefined,'win');if(n>=10){const s=$('div','row',ctx.stage);$('span','note',s,'The code was');code.forEach(c=>peg(s,c));return ctx.over('Locked out',null,'lose')}cur=[];draw()},'pri');
  ctx.info('Guess 0 / 10');draw();
},{low:true,sl:'Guesses'});

reg('pop','Block Pop','Puzzle','Tap a group of two or more touching blocks of the same colour to pop them. Bigger groups score far more.',ctx=>{
  const CW=10,CH=12,S=30,{cv,g}=ctx.canvas(300,360);let cols=Array.from({length:CW},()=>Array.from({length:CH},()=>R(4))),sc=0,parts=[],txt=[],hov=null,ending=false;
  const grp=(c,r)=>{const col=cols[c][r],seen=new Set([c+','+r]),st=[[c,r]];while(st.length){const [a,b]=st.pop();[[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{const x=a+dx,y=b+dy,k=x+','+y;if(cols[x]&&cols[x][y]===col&&!seen.has(k)){seen.add(k);st.push([x,y])}})}return seen};
  const any=()=>cols.some((cl,c)=>cl.some((v,r)=>cl[r+1]===v||(cols[c+1]&&cols[c+1][r]===v)));
  ctx.on(cv,'pointerdown',e=>{e.preventDefault();if(ctx.paused||ending)return;const q=cv.pos(e),c=(q.x/S)|0,r=((360-q.y)/S)|0;if(!cols[c]||cols[c][r]==null)return;const s=grp(c,r);if(s.size<2){beep(160,.06,'triangle',.06);return}
    s.forEach(k=>{const [x,y]=k.split(',').map(Number);burst(parts,x*S+S/2,360-y*S-S/2,PAL[cols[x][y]],3,140)});
    const pts=s.size*(s.size-1);txt.push({x:q.x,y:q.y,t:'+'+pts,l:.9});cols=cols.map((cl,x)=>cl.filter((_,y)=>!s.has(x+','+y))).filter(cl=>cl.length);sc+=pts;
    beep(300+Math.min(s.size,20)*30,.09,'square',.05,0,600+Math.min(s.size,20)*50);if(s.size>=8)noise(.15,.15,0,2000);
    if(!cols.length){sc+=500;txt.push({x:150,y:180,t:'BOARD CLEAR +500',l:1.6})}ctx.score(sc);
    if(!any()){ending=true;ctx.after(900,()=>ctx.over(cols.length?'No more groups':'Board cleared',undefined,cols.length?'end':'win'))}});
  ctx.loop(dt=>{g.fillStyle='#0e0a17';g.fillRect(0,0,300,360);g.fillStyle='rgba(255,255,255,.03)';for(let c=0;c<CW;c+=2)g.fillRect(c*S,0,S,360);
    cols.forEach((cl,c)=>cl.forEach((v,r)=>{const x=c*S,y=360-(r+1)*S;g.fillStyle=PAL[v];rrect(g,x+2,y+2,S-4,S-4,7);g.fill();g.fillStyle='rgba(255,255,255,.35)';rrect(g,x+5,y+4,S-10,5,3);g.fill();g.fillStyle='rgba(0,0,0,.18)';rrect(g,x+2,y+S-8,S-4,6,[0,0,7,7]);g.fill()}));
    parts=drawParts(g,parts,dt,400);txt.forEach(q=>{q.l-=dt;q.y-=30*dt;g.globalAlpha=Math.max(0,q.l);g.fillStyle='#fff';g.strokeStyle='#0008';g.lineWidth=4;g.font=FONT(16,700);g.textAlign='center';g.strokeText(q.t,q.x,q.y);g.fillText(q.t,q.x,q.y)});g.globalAlpha=1;txt=txt.filter(q=>q.l>0)});
});

reg('ttt','Tic-Tac-Toe','Board','You are X. Get three in a row before the computer does.',ctx=>{
  const b=Array(9).fill(0),L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];let busy=false;const cs=ctx.grid(3,9,330,10);boardBox(cs,'#120d1d',10);
  const line=p=>L.find(l=>l.every(i=>b[i]===p)),full=()=>b.every(v=>v);
  const mm=p=>{if(line(-p))return -1;if(full())return 0;let best=-2;for(let i=0;i<9;i++)if(!b[i]){b[i]=p;best=Math.max(best,-mm(-p));b[i]=0}return best};
  const draw=(hl,last)=>cs.forEach((c,i)=>{c.textContent=b[i]===1?'✕':b[i]===-1?'◯':'';c.style.color=b[i]===1?'#2fd6b5':'#ff5d7a';c.style.fontSize='clamp(40px,15vw,70px)';c.style.border='0';c.style.borderRadius='14px';

  cs.forEach((c,i)=>{c.textContent=ord[i];c.style.border='0';c.style.borderRadius='12px';c.style.color=PAL[ord[i]%7];c.style.fontSize='clamp(18px,6vw,28px)';c.style.background='#211a33';c.style.boxShadow='0 3px 0 #120d1d';
    ctx.on(c,'pointerdown',e=>{e.preventDefault();if(ctx.paused||c._done)return;if(ord[i]!==next){anim(c,'shake');beep(150,.08,'triangle',.07);return}if(next===1)t0=performance.now();c._done=1;c.style.background='#120d1d';c.style.color='#2b2242';c.style.boxShadow='none';anim(c,'pop');beep(400+next*28,.05,'square',.04);next++;
    if(next>25){const s=Math.round((performance.now()-t0)/100)/10;ctx.score(s);return ctx.over(s<20?'Speed hunter':'All found',s,'win')}ctx.info('Find '+next)})});
  ctx.loop(()=>{if(t0&&!ctx.done)ctx.score((Math.round((performance.now()-t0)/100)/10).toFixed(1))});
},{low:true,sl:'Seconds'});

/* ---------- launcher ---------- */
let filt='All',shown=null;
function renderShelf(){const q=el.q.value.trim().toLowerCase();el.shelf.textContent='';let n=0;
  GAMES.forEach((gm,i)=>{if(filt!=='All'&&gm.cat!==filt)return;if(q&&!(gm.name+' '+gm.cat).toLowerCase().includes(q))return;n++;
    const b=$('button','cart',el.shelf);b.style.setProperty('--k',`var(${CATVAR[gm.cat]})`);$('span','no',b,String(i+1).padStart(2,'0'));$('span','nm',b,gm.name);$('span','ct',b,gm.cat);
    const best=store.get('b_'+gm.id);if(best!=null&&!gm.ns)$('span','bs',b,'Best '+best);b.addEventListener('click',()=>nav(gm.id))});
  if(!n)$('p','none',el.shelf,'No games match that. Clear the search to see all '+GAMES.length+'.')}
function show(id){const gm=GAMES.find(x=>x.id===id);shown=gm?id:'';if(gm)play(gm);else{stopGame();el.game.hidden=true;el.home.hidden=false;renderShelf()}}
function nav(id){try{if(id)location.hash=id;else history.replaceState(null,'',location.pathname+location.search)}catch(e){try{location.hash=id||''}catch(e2){}}show(id)}
function boot(){el.tag.textContent=GAMES.length+' games in one app. Pick a cartridge and play, on your phone or at a keyboard.';
  ['All',...CATS].forEach(c=>{const b=$('button','chip',el.chips,c);b.setAttribute('aria-pressed',c===filt);b.addEventListener('click',()=>{filt=c;[...el.chips.children].forEach(x=>x.setAttribute('aria-pressed',x===b));renderShelf()})});
  el.q.addEventListener('input',renderShelf);
  const ms=()=>{el.mute.innerHTML=MUTED?'&#128263;':'&#128266;';el.mute.setAttribute('aria-label',MUTED?'Sound off':'Sound on')};ms();
  el.mute.addEventListener('click',()=>{MUTED=!MUTED;store.set('mute',MUTED);ms();if(!MUTED){unlockAudio();setTimeout(()=>SFX.tap(),30)}});el.rand.addEventListener('click',()=>nav(GAMES[R(GAMES.length)].id));
  el.back.addEventListener('click',()=>nav(''));el.quit.addEventListener('click',()=>nav(''));el.again.addEventListener('click',()=>{if(cur)play(cur.game)});
  window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(id!==shown)show(id)});
  show(location.hash.slice(1))}
boot();
if('serviceWorker' in navigator&&location.protocol==='https:'){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
</script>
